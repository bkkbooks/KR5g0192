front:
  text: 上清太上元始耀光金虎鳯文章寶經既九
  hash: sha256:44a156fdfc7d4c702cc4d318582f7c4eb7a35863ef32ad7268dc6766bd37c7cb
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5g0192_HFL_000-001a, image: hfl/1043/1043-176.png}
body:
  text: 上隱書諱上隱書辭地皇叙鳯文章人皇鳯文章髙上鳯文章上隱書諱上隱書辭髙上三皇太真玄洞上洞道君曰金虎鳯文章真符是太真九天父母所出太真丈人從三皇君所受積劫以傳東海小童九天王以傳太上大道君常所寶祕藏之於太微靈都玉房之裏衛以巨天大獸捍以毒龍金虎導以七千人僃于玉闕金晨玉童素靈玉女各三百人侍衛靈文玄暉空映散煙紫庭威振九遐之域皇天大神煥乎上清妙暢啓於自然洞徹慧於元形神虎班其首金虎衛其真智慧摽其幹消魔馘其源微㫖幽邃妙輒難詳皆署天魔之隱諱亦摽百神之內名誦其章則千精駭動詠其篇萬妖束形以三天立政之始傳付太微天帝君使威制六天斬截萬神攝山谷召海神衆精為之束帶群靈施符大威振魔邪滅於形地獄真神回綱轉五星於是太微帝君奉受消魔智慧金虎鳯文佩符遊遨洞戲上清超乘虛逸玄浮霄輪太微澄景於髙館太真止足乎階庭與天地合其契耀七景而髙明齊運度於三皇耀七落於九冥握雲節於崖嶺煥瓊章於機靈括萬度於玄聰檄神真而召百陽於是電耀萬毒蕩滅億千使萬祅滅毒威振遐庭金晨披道無容自開上窺金闕內八景應命回靈官御金虎載我絶空飛羣龍啓仙路遙上謁太微三台為引導七星從奔馳飛澄騁神築鬱鬱乎天機洞觀九玄門遊覽極天涯燕寢瓊房軒往還浩不衰微乎天真符皇靈將妙號地皇敘鳯文章地皇付金虎鳯文符章於太微天帝君太微天帝君告上聖青童君於是西城王君又曰上清大智慧消魔之真經此三皇之鳯章太極之內文衆靈之隱諱髙上之玉篇上皇之寶訣金虎之寶章智慧可以逐穢滅魔大有所禳制毒兼以察邪萬祅莫不摧形佩之則合形飛超散景萬方遊浪海津萬害不傷坐在立亡上與玄通所須立得何願不從今以威神相付勤加修躬真經髙妙當誦此萬通宣勸後賢受真之朋當依太真之制不順者慎勿開容世無信順之人七百年後當相從復出馬氏末善德及宋方威烈輔三傳遂登太極公自非龍鳯姿焉得寶賢同人皇鳯文章鳯文既遐降金虎耀神真所加有元功不降穢濁人覆載三洞師超升髙玄賔過登王母闕遊浪天河津先拜太極帝劫歷三十天頻蒙天真降玉女有數千金童降於左玉女侍右邊加賜九曲節玉與一何鮮天官從其降五嶽導其前天人鼓篁璈嘯歌衛其間山海為靜波清道無翳塵下遊戲四瀆五嶽亦暫旋萬魔悉伏藏妖𦍙並滅身飛景絳闕中鬱鬱從羣仙志專蒙天降白日升皇乾何不為勤徹廣覽明師津天皇道髙妙通上徹聖真地皇次其明德與帝徴因人皇亦聖化德同天齊輪夫師受弟子悉當清齊九十日或三十日或小齊七日皆賫上金七兩以為金虎鳯文之信丹地錦九十尺以誓九天青繒四十尺以盟其文好道合真勤心注玄無吝財物貴身好信應無不降亦靡不新禀之當勤求勿為過之先專專夜不寐務進殊人前何為自怠慢端然受坐愆體法當與道不體勿妄言內外並浮好安可共周旋愼之財為纍毀名沒子身纎毫天已知勿言細不纏願子避世羅漸去庇名山山澤寂無娛可以存萬神時時散財寶以贖宿世愆世世為橋梁濟度幽遠人損有補不足功施揚八方過災當由道道降翼可蒙恩施當迎作勿為待災衝災衝咎已結非可復料通料通力不至念子坐守窮佩金虎鳯文章上符以丹書之亦可以青為地丹書之皇道曰道士學仙真之道在人間建立功德經年之後應入五嶽諸山學士苦辛未及錬隱遁立望芝藥徑造諸山道里長遠忽遇三災五難卒不得施方術身在惡賊鬼魅之中皆當作威神大祝輒向惡處同鳴天鼓三十六通具身中神因祝曰願九天玄音降節萬和總統四張開神萬華越滯天迹三五兼羅回素蔚景詠命伊駝盟丹啓誓蕩釋却痾含光髙映流景盈家伯樂運策威馘天魔收録絶種滅形九羅虎符神威威攝萬邪斬戮無大纎細悉殂祅絶九隂禍滅流沙萬毒悉伏百難並過當為言功遷賞不負太和髙上鳯文章赫赫五芒嶺孤峯耀太輝學者不嚴潔吏兵亦不依我承正道行萬邪何敢加體佩金神信流鈴隨身飛三天符五嶽並導吾後前天羅已張維地網亦布機鬼邪及毒獸見吾即滅摧盜賊何敢前金鳯食汝衰千精即喪目萬魔走如雷何以容盜賊三官應嚴推急走使奔迸虎兵當痛推急急承勑命嚴明宣大威有功當遷賞無功追萬機急急如明天祝律令又有消魔大符在消魔天水經中可預施之以却惡然後神呪行令也此是九天衆魔王之隱音也亦應佩之祝之以制魔也無祝制時亦先服一符益勑內神相應興寧三年乙丑歲七月七日桐柏真人承樂子長安期先生受出三皇藴中金虎鳯文章符令晚學道士許逺遊承受以制萬魔言神祝行至乙未甲申乙亥壬辰癸已之歲九月一日及七月七日四月八日此三日當有賢人道士著七色法衣手持策杖在靈壇之上或在人間告乞時詠經誦書或作狂歌之聲子若見如此之人勤請問之具道情事必當授子金虎上符并諸學要言也愼勿輕之此隱化真人也南嶽真人從太上無極大道君天帝君常所使其時或下在人間觀察末世晚學道士勤志之心爾上清太上元始耀光金虎鳯文章寶經
